<div class="app-container">
  <h2>User Management (CRUD)</h2>

  <!-- Form -->
  <div class="form-container">
    <h3>{{ isEditing ? 'Edit User' : 'Add User' }}</h3>
    <input type="text" placeholder="Name" [(ngModel)]="formData.name" />
    <input type="number" placeholder="Age" [(ngModel)]="formData.age" />
    <input type="text" placeholder="Country" [(ngModel)]="formData.country" />

    <button *ngIf="!isEditing" (click)="addUser()">Add</button>
    <button *ngIf="isEditing" (click)="updateUser()">Update</button>
    <button *ngIf="isEditing" (click)="cancelEdit()">Cancel</button>
  </div>

  <!-- Users Table -->
  <table border="1" cellpadding="5" cellspacing="0">
    <thead>
      <tr>
        <th>Name</th>
        <th>Age</th>
        <th>Country</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngIf="users.length === 0">
        <td colspan="4">No users found.</td>
      </tr>
      <tr *ngFor="let user of users">
        <td>{{ user.name }}</td>
        <td>{{ user.age }}</td>
        <td>{{ user.country }}</td>
        <td>
          <button (click)="editUser(user)">Edit</button>
          <button (click)="deleteUser(user.id)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
